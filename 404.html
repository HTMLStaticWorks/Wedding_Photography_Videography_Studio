<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Wedding Studio </title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/images/brand-logo.svg">
</head>
<body>
    <div class="container">
        <h1 style="font-size: 120px; color: var(--accent-primary); margin-bottom: 0;">404</h1>
        <h2>Page Not Found</h2>
        <p class="text-large" style="margin-bottom: 2rem;">The page you are looking for has been moved or does not exist.</p>
        <a href="index.html" class="btn btn-primary">Return Home</a>
    </div>

    <!-- Enquiry Modal HTML -->
    <div class="modal-overlay" id="enquireOverlay">
        <div class="enquire-modal">
            <button class="close-modal" id="closeEnquireModal">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="step-indicator">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
            </div>
            
            <form id="enquireForm">
                <!-- Step 1 -->
                <div class="form-step active" id="step1">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem; text-align: center;">Let's Get Started</h2>
                    <div class="enquire-form-group">
                        <label>Your Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="enquire-form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                    <div class="enquire-form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="(555) 123-4567" required>
                    </div>
                    <div class="modal-actions" style="justify-content: flex-end;">
                        <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next Step</button>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="form-step" id="step2">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem; text-align: center;">Wedding Details</h2>
                    <div class="enquire-form-group">
                        <label>Photography Style</label>
                        <select required>
                            <option value="">Select a style</option>
                            <option value="editorial">Editorial</option>
                            <option value="cinematic">Cinematic</option>
                            <option value="classic">Classic</option>
                        </select>
                    </div>
                    <div class="enquire-form-group">
                        <label>Estimated Guest Count</label>
                        <select required>
                            <option value="">Select range</option>
                            <option value="elopement">Under 20 (Elopement)</option>
                            <option value="small">20 - 75</option>
                            <option value="medium">75 - 150</option>
                            <option value="large">150+</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(1)">Back</button>
                        <button type="button" class="btn btn-primary" onclick="nextStep(3)">Next Step</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="form-step" id="step3">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem; text-align: center;">Date & Venue</h2>
                    <div class="enquire-form-group">
                        <label>Wedding Date</label>
                        <input type="date" required>
                    </div>
                    <div class="enquire-form-group">
                        <label>Venue (or City)</label>
                        <input type="text" placeholder="e.g. Tuscany, Italy" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="prevStep(2)">Back</button>
                        <button type="submit" class="btn btn-primary">Check Availability</button>
                    </div>
                </div>

                <!-- Step 4 (Success) -->
                <div class="form-step" id="step4" style="text-align: center; padding: 2rem 0;">
                    <svg width="64" height="64" fill="none" stroke="var(--accent-primary)" viewBox="0 0 24 24" style="margin: 0 auto 1.5rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h2 style="margin-bottom: 1rem; font-size: 1.8rem;">Request Received!</h2>
                    <p style="color: var(--text-secondary); line-height: 1.6;">Thank you for your enquiry. Our studio manager will get back to you within 24 hours regarding your date.</p>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal JS -->
    <script>
        const openBtn = document.getElementById('openEnquireModal');
        const overlay = document.getElementById('enquireOverlay');
        const closeBtn = document.getElementById('closeEnquireModal');
        
        if(openBtn) openBtn.addEventListener('click', (e) => { e.preventDefault(); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; });
        if(closeBtn) closeBtn.addEventListener('click', () => { overlay.classList.remove('active'); document.body.style.overflow = 'auto'; });
        if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) { overlay.classList.remove('active'); document.body.style.overflow = 'auto'; }});

        function nextStep(step) {
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            updateDots(step);
        }

        function prevStep(step) {
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            updateDots(step);
        }

        function updateDots(step) {
            document.querySelectorAll('.step-dot').forEach((dot, index) => {
                if(index < step) dot.classList.add('active');
                else dot.classList.remove('active');
            });
            if(step === 4) document.querySelector('.step-indicator').style.display = 'none';
        }

        document.getElementById('enquireForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            nextStep(4);
        });
    </script>
</body>
</html>
